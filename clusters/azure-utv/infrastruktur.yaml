# To lag, i rekkefølge:
#   1. controllers – programvare som installerer CRD-er (cert-manager)
#   2. configs     – ressurser som bruker CRD-ene (ClusterIssuers, Certificates)
# configs venter på controllers, så CRD-ene finnes før de brukes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastruktur/controllers/azure-utv
  prune: true
  wait: true                      # klar først når cert-manager kjører
  sourceRef:
    kind: GitRepository
    name: plattform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastruktur/configs/azure-utv
  prune: true
  sourceRef:
    kind: GitRepository
    name: plattform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
